<text x="42" y="482" fill="#94a3b8" font-family="Arial" font-size="15">Síntesis: netlist mapeada, reloj ideal y sin RC extraído.</text>
<text x="42" y="506" fill="#94a3b8" font-family="Arial" font-size="15">Post-routing: reloj propagado y modelo físico. Etapas no equivalentes en parasitismos.</text>
