<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 550" width="980" height="550" role="img" aria-labelledby="title desc">
<title id="title">ALU+ CHAMO — STA síntesis vs post-routing</title>
<desc id="desc">Síntesis, reloj ideal sin parasitismos: slack setup 51.01 ns, Fmax 20.41 MHz, hold 0.33 ns. Post-routing, reloj propagado: slack setup 43.74 ns, Fmax 17.77 MHz, hold 0.35 ns.</desc>
