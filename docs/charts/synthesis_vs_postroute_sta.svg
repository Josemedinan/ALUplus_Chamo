<text x="42" y="82" fill="#aabbd0" font-family="Arial,Helvetica,sans-serif" font-size="16">ALU+ CHAMO · SKY130HD · objetivo: 100 ns (10 MHz) · esquina TT 25 °C, 1.80 V en síntesis</text>
<text x="42" y="129" fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold">Frecuencia máxima estimada (MHz)</text>
